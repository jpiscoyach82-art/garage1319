name: Validar Garage 1319
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 1'
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validar cobertura del inventario público
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run check:images
